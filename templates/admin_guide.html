{% extends 'base.html' %}{% block title %}Hồ sơ HDV #{{g.id}} – HDVIA{% endblock %}{% block content %}<a class="back" href="/admin/guides">← Danh sách hồ sơ</a><div class="card"><span class="eyebrow">HỒ SƠ #{{g.id}}</span><h1>{{g.name}}</h1><p>{{g.email}} · {{g.phone}}</p><p><b>Số thẻ:</b> {{g.card_number}} · <b>Loại:</b> {{g.card_type}}</p><p><b>Khu vực:</b> {{g.area}} · <b>Ngôn ngữ:</b> {{g.languages}}</p><img class="guide-card-img" src="/admin/guides/{{g.id}}/image"><form method="post"><label>Ghi chú quản trị</label><textarea name="note" rows="4">{{g.admin_note or ''}}</textarea><div class="actions"><button class="btn primary" name="action" value="APPROVE">Duyệt hồ sơ</button><button class="btn" name="action" value="NEED_MORE_INFORMATION">Yêu cầu bổ sung</button><button class="btn danger-btn" name="action" value="REJECT">Từ chối</button></div></form></div>{% endblock %}
