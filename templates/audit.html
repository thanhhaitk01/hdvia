{% extends "base.html" %}{% block title %}Audit Log{% endblock %}{% block content %}
<div class="card"><h1>Audit Log</h1><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr>
{% for x in rows %}<tr><td>{{x.created_at}}</td><td>{{x.email or ''}}</td><td>{{x.action}}</td><td>{{x.target_type}} {{x.target_id or ''}}</td><td>{{x.detail}}</td></tr>{% endfor %}</table></div>{% endblock %}
